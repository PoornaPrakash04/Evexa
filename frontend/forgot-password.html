<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | EVEXA</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: Poppins, sans-serif;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f7fb;
      overflow: hidden;
      position: relative;
    }

    /* -------- FLOATING SHAPES -------- */
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    .shape {
      position: absolute;
      border-radius: 50%;
      opacity: .35;
      animation: float 8s infinite ease-in-out;
      will-change: transform;
    }

    .s1 { width:220px; height:220px; background:linear-gradient(45deg,#11998e,#38ef7d); top:40%; left:-60px; }
    .s2 { width:180px; height:180px; background:linear-gradient(45deg,#8e44ff,#32d2aa); top:10%; right:-60px; animation-delay:2s; }
    .s3 { width:140px; height:140px; background:linear-gradient(45deg,#ff7a18,#ffc371); bottom:80px; left:40%; animation-delay:3s; }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-35px); }
    }

    /* -------- CARD -------- */
    .card {
      background: rgba(255,255,255,.85);
      backdrop-filter: blur(10px);
      padding: 50px 45px;
      border-radius: 22px;
      width: 400px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,.08);
      position: relative;
      z-index: 2;
    }

    .step { display: none; }
    .step.active { display: block; }

    /* Step indicator */
    .steps-indicator {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
    }

    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: #e3e3e3;
      transition: all .3s ease;
    }

    .step-dot.active {
      background: #11998e;
      width: 24px;
      border-radius: 4px;
    }

    .step-dot.done { background: #11998e; }

    h1 { font-size: 26px; margin-bottom: 8px; }

    .subtitle { color: #777; font-size: 14px; margin-bottom: 28px; }

    /* -------- INPUTS -------- */
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      text-align: left;
      margin-bottom: 16px;
    }

    label {
      font-size: 11px;
      font-weight: 600;
      color: #999;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    input {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e3e3e3;
      font-size: 15px;
      font-family: Poppins, sans-serif;
      outline: none;
      transition: .25s;
      width: 100%;
    }

    input:focus {
      border-color: #11998e;
      box-shadow: 0 0 0 3px rgba(17,153,142,.15);
    }

    input.error {
      border-color: #ff5f6d;
      box-shadow: 0 0 0 3px rgba(255,95,109,.12);
    }

    /* OTP boxes */
    .otp-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 16px;
    }

    .otp-row input {
      width: 52px;
      height: 56px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      padding: 0;
      border-radius: 12px;
    }

    /* -------- PASSWORD STRENGTH -------- */
    .strength-bar { display:flex; gap:4px; margin-top:5px; }
    .strength-seg { flex:1; height:3px; border-radius:99px; background:#e3e3e3; transition:background .3s; }
    .strength-label { font-size:11px; color:#aaa; margin-top:3px; }

    /* -------- BUTTON -------- */
    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 30px;
      background: #11998e;
      color: white;
      font-size: 15px;
      font-weight: 600;
      font-family: Poppins, sans-serif;
      cursor: pointer;
      transition: .25s;
      margin-top: 4px;
    }

    .btn:hover { transform: scale(1.04); box-shadow: 0 10px 25px rgba(17,153,142,.35); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    /* -------- ERROR / INFO MSG -------- */
    .msg {
      font-size: 13px;
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
    }

    .msg.error { color: #ff5f6d; }
    .msg.success { color: #11998e; }

    /* Resend */
    .resend {
      font-size: 13px;
      color: #aaa;
      margin-top: 14px;
    }

    .resend span {
      color: #11998e;
      font-weight: 600;
      cursor: pointer;
    }

    .resend span:hover { text-decoration: underline; }

    /* -------- SUCCESS STATE -------- */
    .success-icon {
      width: 64px; height: 64px;
      border-radius: 50%;
      background: linear-gradient(45deg, #11998e, #38ef7d);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: white;
      margin: 0 auto 16px;
      animation: popIn .4s cubic-bezier(.34,1.56,.64,1) both;
      box-shadow: 0 10px 30px rgba(17,153,142,.35);
    }

    @keyframes popIn {
      from { transform: scale(.4); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    /* -------- BACK BUTTON -------- */
    .back-wrapper {
      position: fixed;
      top: 30px; left: 40px;
      z-index: 3;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 30px;
      background: linear-gradient(135deg, #38ef7d, #f2f2f2);
      box-shadow: 0 8px 20px rgba(0,0,0,.08);
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      color: #000;
      transition: box-shadow .3s ease;
    }

    .back-wrapper:hover { box-shadow: 0 12px 25px rgba(0,0,0,.12); }
    .back-wrapper:hover .arrow { transform: translateX(-4px); }
    .back-wrapper .arrow { font-size: 18px; transition: transform .3s ease; }
  </style>
</head>

<body>

<div class="background">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<div class="card">

  <!-- Step dots -->
  <div class="steps-indicator">
    <div class="step-dot active" id="dot1"></div>
    <div class="step-dot"        id="dot2"></div>
    <div class="step-dot"        id="dot3"></div>
  </div>

  <!-- ── STEP 1: Enter Email ── -->
  <div class="step active" id="step1">
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your registered email address and we'll send you an OTP.</p>
    <div class="field-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="your@email.com" autocomplete="email"/>
    </div>
    <button class="btn" id="sendOtpBtn">Send OTP</button>
    <p class="msg" id="msg1"></p>
  </div>

  <!-- ── STEP 2: Enter OTP ── -->
  <div class="step" id="step2">
    <h1>Enter OTP</h1>
    <p class="subtitle" id="otpSubtitle">We sent a 6-digit code to your email.</p>
    <div class="otp-row">
      <input type="text" maxlength="1" class="otp-input" inputmode="numeric"/>
      <input type="text" maxlength="1" class="otp-input" inputmode="numeric"/>
      <input type="text" maxlength="1" class="otp-input" inputmode="numeric"/>
      <input type="text" maxlength="1" class="otp-input" inputmode="numeric"/>
      <input type="text" maxlength="1" class="otp-input" inputmode="numeric"/>
      <input type="text" maxlength="1" class="otp-input" inputmode="numeric"/>
    </div>
    <button class="btn" id="verifyOtpBtn">Verify OTP</button>
    <p class="msg" id="msg2"></p>
    <p class="resend" id="resendWrap">Didn't receive it? <span id="resendBtn">Resend OTP</span></p>
  </div>

  <!-- ── STEP 3: New Password ── -->
  <div class="step" id="step3">
    <h1>New Password</h1>
    <p class="subtitle">Choose a strong new password for your account.</p>
    <div class="field-group">
      <label for="newPassword">New Password</label>
      <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password"/>
      <div class="strength-bar">
        <div class="strength-seg" id="seg1"></div>
        <div class="strength-seg" id="seg2"></div>
        <div class="strength-seg" id="seg3"></div>
        <div class="strength-seg" id="seg4"></div>
      </div>
      <div class="strength-label" id="strengthLabel"></div>
    </div>
    <div class="field-group">
      <label for="confirmPassword">Confirm Password</label>
      <input type="password" id="confirmPassword" placeholder="Re-enter password" autocomplete="new-password"/>
    </div>
    <button class="btn" id="resetBtn">Reset Password</button>
    <p class="msg" id="msg3"></p>
  </div>

  <!-- ── STEP 4: Success ── -->
  <div class="step" id="step4">
    <div class="success-icon">✓</div>
    <h1>Password Reset!</h1>
    <p class="subtitle">Your password has been updated successfully.</p>
    <button class="btn" id="goSignInBtn">Go to Sign In</button>
  </div>

</div>

<a href="index.html" class="back-wrapper">
  <span class="arrow">←</span> Back
</a>

<script>
  const API = "https://evexa-production.up.railway.app/api/forgot-password"

  let verifiedEmail = "";
  let verifiedOtp   = "";

  // ── Step helpers ─────────────────────────────────────────
  function showStep(n) {
    document.querySelectorAll(".step").forEach((s, i) => {
      s.classList.toggle("active", i + 1 === n);
    });
    // Update dots
    [1, 2, 3].forEach(i => {
      const dot = document.getElementById(`dot${i}`);
      dot.className = "step-dot";
      if (i < n)  dot.classList.add("done");
      if (i === n && n <= 3) dot.classList.add("active");
    });
  }

  function setMsg(id, text, type = "error") {
    const el = document.getElementById(id);
    el.textContent = text;
    el.className = `msg ${type}`;
  }

  // ── OTP box auto-advance ─────────────────────────────────
  document.querySelectorAll(".otp-input").forEach((input, i, inputs) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "");
      if (input.value && i < inputs.length - 1) inputs[i + 1].focus();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) inputs[i - 1].focus();
    });
    input.addEventListener("paste", (e) => {
      e.preventDefault();
      const pasted = e.clipboardData.getData("text").replace(/\D/g, "").slice(0, 6);
      [...pasted].forEach((ch, j) => { if (inputs[j]) inputs[j].value = ch; });
      const next = inputs[Math.min(pasted.length, 5)];
      if (next) next.focus();
    });
  });

  function getOtp() {
    return [...document.querySelectorAll(".otp-input")].map(i => i.value).join("");
  }

  // ── Password strength ────────────────────────────────────
  const sColors = ["#ff5f6d", "#ffc371", "#11998e", "#38ef7d"];
  const sLabels = ["Weak", "Fair", "Good", "Strong"];

  document.getElementById("newPassword").addEventListener("input", function () {
    const pw = this.value;
    let score = 0;
    if (pw.length >= 8)           score++;
    if (/[A-Z]/.test(pw))         score++;
    if (/[0-9]/.test(pw))         score++;
    if (/[^A-Za-z0-9]/.test(pw))  score++;
    ["seg1","seg2","seg3","seg4"].forEach((id, i) => {
      document.getElementById(id).style.background = i < score ? sColors[score - 1] : "";
    });
    const lbl = document.getElementById("strengthLabel");
    lbl.textContent = pw ? sLabels[score - 1] || "" : "";
    lbl.style.color = sColors[score - 1] || "";
  });

  // ── STEP 1: Send OTP ────────────────────────────────────
  document.getElementById("sendOtpBtn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    if (!email) return setMsg("msg1", "Please enter your email address.");

    const btn = document.getElementById("sendOtpBtn");
    btn.disabled = true;
    btn.textContent = "Sending…";

    try {
      const res  = await fetch(`${API}/send-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();

      if (!res.ok) {
        setMsg("msg1", data.message || "Failed to send OTP.");
        btn.disabled = false;
        btn.textContent = "Send OTP";
        return;
      }

      verifiedEmail = email;
      document.getElementById("otpSubtitle").textContent = `We sent a 6-digit code to ${email}`;
      showStep(2);
      document.querySelectorAll(".otp-input")[0].focus();
    } catch {
      setMsg("msg1", "Server error. Please try again.");
      btn.disabled = false;
      btn.textContent = "Send OTP";
    }
  });

  // ── STEP 2: Verify OTP ──────────────────────────────────
  document.getElementById("verifyOtpBtn").addEventListener("click", async () => {
    const otp = getOtp();
    if (otp.length < 6) return setMsg("msg2", "Please enter the complete 6-digit OTP.");

    const btn = document.getElementById("verifyOtpBtn");
    btn.disabled = true;
    btn.textContent = "Verifying…";

    try {
      const res  = await fetch(`${API}/verify-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: verifiedEmail, otp }),
      });
      const data = await res.json();

      if (!res.ok) {
        setMsg("msg2", data.message || "Invalid OTP.");
        btn.disabled = false;
        btn.textContent = "Verify OTP";
        return;
      }

      verifiedOtp = otp;
      showStep(3);
      document.getElementById("newPassword").focus();
    } catch {
      setMsg("msg2", "Server error. Please try again.");
      btn.disabled = false;
      btn.textContent = "Verify OTP";
    }
  });

  // ── Resend OTP ───────────────────────────────────────────
  document.getElementById("resendBtn").addEventListener("click", async () => {
    document.querySelectorAll(".otp-input").forEach(i => i.value = "");
    setMsg("msg2", "Resending OTP…", "success");

    try {
      const res  = await fetch(`${API}/send-otp`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: verifiedEmail }),
      });
      const data = await res.json();
      setMsg("msg2", res.ok ? "OTP resent successfully." : data.message || "Failed to resend.", res.ok ? "success" : "error");
    } catch {
      setMsg("msg2", "Server error. Please try again.");
    }
  });

  // ── STEP 3: Reset Password ──────────────────────────────
  document.getElementById("resetBtn").addEventListener("click", async () => {
    const newPassword     = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) return setMsg("msg3", "Password must be at least 8 characters.");
    if (newPassword !== confirmPassword) return setMsg("msg3", "Passwords do not match.");

    const btn = document.getElementById("resetBtn");
    btn.disabled = true;
    btn.textContent = "Resetting…";

    try {
      const res  = await fetch(`${API}/reset`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: verifiedEmail, otp: verifiedOtp, newPassword }),
      });
      const data = await res.json();

      if (!res.ok) {
        setMsg("msg3", data.message || "Reset failed.");
        btn.disabled = false;
        btn.textContent = "Reset Password";
        return;
      }

      showStep(4);
    } catch {
      setMsg("msg3", "Server error. Please try again.");
      btn.disabled = false;
      btn.textContent = "Reset Password";
    }
  });

  // ── Step 4: Go to sign in ────────────────────────────────
  // Redirect to the correct sign-in page based on where the user came from
  document.getElementById("goSignInBtn").addEventListener("click", () => {
    const ref = document.referrer;
    if (ref.includes("fcsignin"))      window.location.href = "/frontend/faculty/fcsignin.html";
    else if (ref.includes("ogsignin")) window.location.href = "/frontend/organizer/ogsignin.html";
    else if (ref.includes("adsignin")) window.location.href = "/frontend/admin/adsignin.html";
    else                               window.location.href = "/frontend/student/stsignin.html";
  });
</script>

</body>
</html>
