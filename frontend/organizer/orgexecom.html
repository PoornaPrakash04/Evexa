<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EVEXA — Club Execom</title>

  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="orgexecom.css" />
</head>
<body>

  <header class="topbar">
    <div class="left">
      <button class="btn-back" id="backBtn" title="Back">←</button>
      <div>
        <div class="title">Club Execom</div>
        <div class="sub" id="clubName">Loading…</div>
      </div>
    </div>

    <div class="right">
      <button class="btn" id="addBtn">+ Add Member</button>
      
    </div>
  </header>

  <main class="wrap">
    <!-- Club Hero -->
<section class="club-hero">
  <div class="club-hero-content">
    <img id="clubImage" src="images/default-club.jpg" alt="Club Image" class="club-image">
    <div>
      <h1 class="club-title" id="clubTitle">Loading…</h1>
      <p class="club-desc" id="clubDesc">Loading club details…</p>
    </div>
  </div>
</section>
    <div class="toolbar">
      <div class="search">
        <input id="searchBox" placeholder="Search name / position..." />
      </div>
    </div>

    <section id="execomGrid" class="grid"></section>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="execomEditModal">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title" id="execomModalTitle">✏️ Edit Member</div>
        <button class="x" id="closeModalBtn">✕</button>
      </div>

      <form id="execomEditForm" class="form">
        <input type="hidden" id="execomEditId" />

        <label>Name *</label>
        <input id="execomEditName" required />

        <label>Position *</label>
        <input id="execomEditPosition" required />

        <label>Class</label>
        <input id="execomEditClass" />

        <label>Email</label>
        <input id="execomEditEmail" type="email" />

        <label>Phone</label>
        <input id="execomEditPhone" />

        <div class="actions">
          <button type="button" class="btn ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <script src="orgexecom.js"></script>
</body>
</html>
