<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EVEXA – Event Detail</title>

  <!-- use same fonts like your dashboard -->
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <link rel="stylesheet" href="org.css" />
</head>
<body>

  <!-- Topbar (matches your theme) -->
  <header class="topbar">
    <div class="left">
      <button class="icon-btn" onclick="history.back()" title="Back">
        <i class="fa fa-arrow-left"></i>
      </button>

      <div class="brand">
        <div class="logo">E</div>
        <div>
          <div class="brand-title">EVEXA</div>
          <div class="brand-sub">Events</div>
        </div>
      </div>
    </div>

    <div class="right">
      <button class="btn btn-outline" id="topShareBtn"><i class="fa fa-share"></i> Share</button>

      <button class="btn btn-primary" id="editTopBtn">
      <i class="fa fa-pen"></i> Edit
</button>

    </div>
  </header>

  <main class="wrap">
    <section class="detail-card" id="detailContainer">
      <!-- Filled by JS -->
    </section>
  </main>

  <script src="org.js"></script>
</body>
</html>
