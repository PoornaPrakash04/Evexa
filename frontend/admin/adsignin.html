<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Sign In | EVEXA</title>
  <link rel="stylesheet" href="adsignin.css">
</head>

<body>

<div class="background">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<div class="signin-container">

  <h1>Admin Sign In</h1>
  <p class="subtitle">Administrator dashboard access</p>

  <form class="signin-form" id="signinForm">
    <input type="text"     id="admin_id"  placeholder="Admin ID" required autocomplete="username"/>
    <div class="password-wrapper">
  <input type="password" id="password" placeholder="Password" required autocomplete="current-password"/>
  <span id="togglePassword" class="eye-icon">👁️</span>
</div>
    <button type="submit" class="signin-btn">Sign In</button>
  </form>
  <br>
  <p class="register-prompt">
  <a href="../forgot-password.html" class="register-link">Forgot password?</a>
</p>

</div>
<a href="../home.html" class="back-wrapper">← Back</a>
<script src="admin-signin.js"></script>
</body>
</html>
