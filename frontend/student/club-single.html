
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Club | EVEXA</title>
  <link rel="stylesheet" href="student-dashboard.css" />
  <link rel="stylesheet" href="clubs.css" />
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar">
      
      <div class="brand">
        <div class="brand-logo">S</div>
        <div class="brand-text">
          <div class="brand-name">EVEXA<span></span></div>
          <div class="brand-sub">Student Portal</div>
        </div>
      </div>

      <nav class="nav">
        
        <a class="nav-item" href="student-dashboard.html" data-nav="student-dashboard.html">
          <span class="icon">🏠</span>
          <span>Dashboard</span>
        </a>

        <!-- ✅ Renamed from "Event Details" to "Events" -->
        <a class="nav-item" href="event-details.html" data-nav="event-details.html">
          <span class="icon">📅</span>
          <span>Events</span>
        </a>

        <!-- ✅ My Clubs -->
        <a class="nav-item" href="clubs.html?view=mine">
  <span class="icon">🏛️</span><span>My Clubs</span>
</a>
        <a class="nav-item" href="my-issues.html">🚩 <span>My Issues</span></a>
      </nav>

      <div class="sidebar-bottom">
        <div class="mini-user">
          <div class="mini-avatar" aria-hidden="true"></div>
          <div class="mini-meta">
            <div class="mini-name" id="miniName"></div>
            <div class="mini-role">Student</div>
          </div>
        </div>
      </div>
    </aside>
    <!-- Main -->
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="icon-btn" id="sidebarToggle" aria-label="Toggle Sidebar">☰</button>
          <div class="page-title">
            <div class="title" id="topbarTitle">Club Details</div>
            <div class="subtitle">Full club information</div>
          </div>
        </div>
        <div class="topbar-right">
          <nav class="top-links">
  <button class="icon-btn theme-toggle-btn" id="themeToggle" onclick="toggleTheme()" title="Switch to Light Mode">🌙</button>

  <!-- Notification Bell -->
  <div class="notif-wrap">
    <button class="icon-btn notif-bell" id="notifBtn" title="Notifications">
      🔔
    </button>
    <div class="notif-dropdown" id="notifDropdown">
      <div class="notif-drop-head">
        <span class="notif-drop-title">🔔 Notifications</span>
        <button class="notif-clear-btn" id="notifClearAll" onclick="clearAllNotifs()">Clear all</button>
      </div>
      <div class="notif-drop-list" id="notifDropList"></div>
      <div class="notif-drop-footer">
        <button class="notif-view-all-btn" onclick="openNotifHistoryPage()">View all notifications →</button>
      </div>
    </div>
  </div>
  <button class="top-link" id="clubsBtn" type="button" onclick="window.location.href='clubs.html'">Clubs</button>
  <button class="top-link" type="button" onclick="window.location.href='eve.html'">EVE</button>
  <button class="top-link danger" id="logoutBtn" type="button" onclick="logout()">Logout</button>
</nav>
        </div>
      </header>

      <section class="content" id="pageContent">
        <div style="text-align:center;padding:60px;color:#6b7280;font-weight:700;">Loading club...</div>
      </section>
    </main>
  </div>
  <script src="theme.js"></script>
  <script src="student-dashboard.js"></script>
  <script src="club-single.js"></script>
</body>
</html>
