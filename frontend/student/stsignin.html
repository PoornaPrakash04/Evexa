<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Sign In | EVEXA</title>
  <link rel="stylesheet" href="stsignin.css">
</head>

<body>

<!-- Soft Floating Shapes -->
<div class="background">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<div class="signin-container">

  <h1>Student Sign In</h1>
  <p class="subtitle">Access your dashboard</p>

  <form class="signin-form" id="loginForm">
    <input type="text"     id="admission_no" placeholder="Admission Number" required autocomplete="username"/>
    <input type="password" id="password"     placeholder="Password"          required autocomplete="current-password"/>
    <button type="submit" class="signin-btn">Sign In</button>
  </form>

  <p class="extra">Forgot password?</p>

</div>
<a href="../index.html" class="back-wrapper">← Back</a>
<script src="stsignin.js"></script>
</body>
</html>
