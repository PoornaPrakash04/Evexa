<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Sign In | EVEXA</title>
  <link rel="stylesheet" href="stsignin.css">
</head>

<body>


<div class="background">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<div class="signin-container">

  <h1>Student Sign In</h1>
  <p class="subtitle">Access your dashboard</p>

  <form class="signin-form" id="loginForm">
    <input type="text"     id="admission_no" placeholder="Admission Number" required autocomplete="username"/>
    <div class="password-wrapper">
  <input type="password" id="password" placeholder="Password" required autocomplete="current-password"/>
  <span id="togglePassword" class="eye-icon">👁️</span>
</div>
    <button type="submit" class="signin-btn">Sign In</button>
  </form>
<br>
<p class="register-prompt">
  <a href="../forgot-password.html" class="register-link">Forgot password?</a>
</p>

</div>
<a href="../home.html" class="back-wrapper">← Back</a>
<script src="stsignin.js"></script>
</body>
</html>
