<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Faculty Sign In | EVEXA</title>
  <link rel="stylesheet" href="fcsignin.css">
</head>

<body>

<!-- Floating Background -->
<div class="background">
  <div class="shape s1"></div>
  <div class="shape s2"></div>
  <div class="shape s3"></div>
</div>

<!-- Sign In Card -->
<div class="signin-container">

  <h1>Faculty Sign In</h1>
  <p class="subtitle">Access your faculty dashboard</p>

  <form class="signin-form" id="signinForm">
    <input type="text"     id="faculty_no" placeholder="Faculty No." required autocomplete="username"/>
    <input type="password" id="password"   placeholder="Password"    required autocomplete="current-password"/>
    <button type="submit" class="signin-btn">Sign In</button>
  </form>
  <br>
  <p class="register-prompt">
    New here? <a href="fcregister.html" class="register-link">Register</a>
  </p>

</div>
<a href="../index.html" class="back-wrapper">← Back</a>
<script src="faculty-signin.js"></script>
</body>
</html>
