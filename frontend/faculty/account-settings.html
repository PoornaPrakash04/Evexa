<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Account Settings | EVEXA</title>
  <link rel="stylesheet" href="account-settings.css" />
</head>
<body>
  <div class="settings-page">
    <div class="settings-card">
      <div class="settings-head">
        <div>
          <h1>Edit Profile</h1>
          <p>Update your faculty account details</p>
        </div>
        <button class="back-btn" onclick="goBack()">← Back</button>
      </div>

      <form id="accountForm" class="settings-form">
        <div class="avatar-box">
          <div class="avatar" id="profileAvatar">FA</div>
          <div>
            <div class="avatar-name" id="profileNamePreview">Faculty Name</div>
            <div class="avatar-sub">Faculty Account</div>
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="facultyNo">Faculty No</label>
            <input type="text" id="facultyNo" disabled />
          </div>

          <div class="form-group">
            <label for="department">Department</label>
            <input type="text" id="department" />
          </div>

          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" />
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" />
          </div>

          <div class="form-group">
            <label for="phone">Phone</label>
            <input type="text" id="phone" />
          </div>
        </div>

        <div class="section-title">Change Password</div>

        <div class="form-grid">
          <div class="form-group">
            <label for="currentPassword">Current Password</label>
            <input type="password" id="currentPassword" placeholder="Enter current password" />
          </div>

          <div class="form-group">
            <label for="newPassword">New Password</label>
            <input type="password" id="newPassword" placeholder="Enter new password" />
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm New Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm new password" />
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn ghost" onclick="goBack()">Cancel</button>
          <button type="submit" class="btn primary">Save Changes</button>
        </div>

        <div class="msg" id="formMsg"></div>
      </form>
    </div>
  </div>

  <script src="account-settings.js"></script>
</body>
</html>
